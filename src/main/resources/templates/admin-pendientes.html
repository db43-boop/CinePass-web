<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Panel de administración')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('admin')}"></header>
<main class="container py-4 py-lg-5" style="max-width:1100px">
    <h1>Comprobantes pendientes</h1>
    <p><a class="cp-btn cp-btn-primary" th:href="@{/admin/inventario}">Gestionar inventario</a></p>
    <p role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p role="alert" th:if="${error}" th:text="${error}"></p>
    <div class="cp-card admin-table-wrap admin-pending-table" th:if="${!#lists.isEmpty(comprobantes)}">
        <table class="admin-table">
            <thead><tr><th>Cliente</th><th>Plataforma</th><th>Método</th><th>Operación</th><th>Monto</th><th>Acciones</th></tr></thead>
            <tbody><tr th:each="c : ${comprobantes}">
                <td data-label="Cliente" th:text="${c.cliente}"></td><td data-label="Plataforma" th:text="${c.plataforma}"></td>
                <td data-label="Método" th:text="${c.metodoPago}"></td><td data-label="Operación" th:text="${c.numeroOperacion}"></td><td data-label="Monto" th:text="${c.monto}"></td>
                <td data-label="Acciones"><div class="admin-actions">
                <a class="cp-btn cp-btn-sm cp-btn-ghost" target="_blank" rel="noopener" th:href="@{/admin/comprobantes/{id}/archivo(id=${c.id})}">Ver PDF</a>
                <form method="post" th:action="@{/admin/comprobantes/{id}/resolver(id=${c.id})}">
                    <input type="hidden" name="_formToken" th:value="${formToken}">
                    <button class="cp-btn cp-btn-sm cp-btn-ok" name="aprobar" value="true">Aprobar</button>
                    <button class="cp-btn cp-btn-sm cp-btn-bad" name="aprobar" value="false">Rechazar</button>
                </form></div></td>
            </tr></tbody>
        </table>
    </div>
    <p th:if="${#lists.isEmpty(comprobantes)}">No hay comprobantes pendientes.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
