<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('cliente')}"></header>
<main class="container py-5" style="max-width:500px">
    <section class="cp-card">
        <h1>Crear cuenta</h1>
        <p role="alert" th:if="${error}" th:text="${error}"></p>
        <form method="post" th:action="@{/registro}">
            <input type="hidden" name="_formToken" th:value="${formToken}">
            <div class="field"><label for="nombres">Nombres</label><input class="input" id="nombres" name="nombres" maxlength="100" required></div>
            <div class="field"><label for="apellidos">Apellidos</label><input class="input" id="apellidos" name="apellidos" maxlength="100" required></div>
            <div class="field"><label for="correo">Correo</label><input class="input" id="correo" name="correo" type="email" maxlength="150" required></div>
            <div class="field"><label for="telefono">Teléfono</label><input class="input" id="telefono" name="telefono" maxlength="20"></div>
            <div class="field"><label for="password">Contraseña</label><input class="input" id="password" name="password" type="password" minlength="8" required></div>
            <button class="cp-btn cp-btn-primary" type="submit">Crear cuenta</button>
        </form>
    </section>
</main>
</body></html>
