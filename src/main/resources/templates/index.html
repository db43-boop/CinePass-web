<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinepass Web - Catálogo de Streaming</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🎬 Cinepass Web</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Plataformas de Streaming en Perú</h1>
            <p class="lead text-muted">Selecciona tu perfil o cuenta completa de forma rápida y segura mediante Yape o Plin.</p>
        </div>
        
        <!-- Bucle dinámico de Thymeleaf con la lista de perfiles -->
        <div class="row">
            <div class="col-md-4 mb-4" th:each="perfil : ${perfiles}">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title fw-bold text-dark" th:text="${perfil.plataforma}">Plataforma</h5>
                            <p class="card-text text-muted" th:text="${perfil.tipoPlan}">Plan / Descripción</p>
                        </div>
                        <div class="mt-3">
                            <p class="text-success fw-bold fs-4 mb-1" th:text="'S/ ' + ${#numbers.formatDecimal(perfil.precio, 1, 2)}">S/ 0.00</p>
                            <span class="badge bg-success mb-3" th:text="${perfil.estado}">DISPONIBLE</span>
                            <a href="#" class="btn btn-primary w-100 fw-bold">Reservar (15 min)</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Mensaje por si la lista está vacía -->
            <div class="col-12 text-center py-4" th:if="${#lists.isEmpty(perfiles)}">
                <p class="text-muted fs-5">No hay perfiles de streaming disponibles en este momento.</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (Opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
