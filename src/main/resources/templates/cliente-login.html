<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('cliente')}"></header>
<main class="container py-5" style="max-width:500px">
    <section class="cp-card">
        <h1>Iniciar sesión</h1>
        <p th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</p>
        <p role="alert" th:if="${error}" th:text="${error}"></p>
        <form method="post" th:action="@{/login}">
            <input type="hidden" name="_formToken" th:value="${formToken}">
            <div class="field"><label for="correo">Correo</label><input class="input" id="correo" name="correo" type="email" required></div>
            <div class="field"><label for="password">Contraseña</label><input class="input" id="password" name="password" type="password" required></div>
            <button class="cp-btn cp-btn-primary" type="submit">Ingresar</button>
        </form>
        <p><a th:href="@{/registro}">Crear cuenta</a></p>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
